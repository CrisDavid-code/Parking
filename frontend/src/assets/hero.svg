<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" role="img" aria-label="Ilustración: estacionamiento por niveles con una ruta hasta el vehículo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101828"/><stop offset="1" stop-color="#0b1a33"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="512" rx="28" fill="url(#bg)"/>
  <!-- Isometric floors (top: L3, bottom: B2) -->
  <g fill="none" stroke="#3b4a66" stroke-width="2">
    <path d="M320 70 L520 170 L320 270 L120 170 Z" fill="#1d2b45"/>
    <path d="M320 150 L520 250 L320 350 L120 250 Z" fill="#18253d" opacity=".95"/>
    <path d="M320 230 L520 330 L320 430 L120 330 Z" fill="#132037" opacity=".95"/>
  </g>
  <g font-family="Sora, Manrope, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">
    <text x="96" y="174">L3</text><text x="96" y="254">B1</text><text x="96" y="334">B2</text>
  </g>
  <!-- Elevator shaft -->
  <rect x="268" y="150" width="22" height="200" rx="4" fill="#2563EB" opacity=".25"/>
  <!-- Route: L3 → elevator → B2 → row C → spot -->
  <path d="M220 160 L279 190 L279 350 L380 400 L430 375" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="220" cy="160" r="9" fill="#14B8A6"/>
  <!-- Parked car + pin -->
  <rect x="418" y="360" width="34" height="18" rx="6" fill="#e2e8f0" transform="rotate(-26 435 369)"/>
  <path d="M440 318 c-12 0 -20 9 -20 20 c0 15 20 32 20 32 s20 -17 20 -32 c0 -11 -8 -20 -20 -20z" fill="#14B8A6" filter="url(#glow)"/>
  <circle cx="440" cy="338" r="7" fill="#101828"/>
  <!-- Phone -->
  <g transform="translate(470 40)">
    <rect width="120" height="210" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="10" y="16" width="100" height="180" rx="12" fill="#111c33"/>
    <text x="60" y="44" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" fill="#94a3b8">Tu vehículo</text>
    <text x="60" y="70" text-anchor="middle" font-family="Sora, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">B2 · C · 148</text>
    <path d="M60 90 L60 150" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 138 L60 152 L72 138" fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="178" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10" fill="#94a3b8">Ilustración</text>
  </g>
</svg>
